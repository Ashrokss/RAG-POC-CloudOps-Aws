AWSTemplateFormatVersion: '2010-09-09'
Description: >
  CloudOps360 SRE agent access, with Amazon Bedrock. Creates ONE IAM role that
  trusts CloudOps360's account, protected by an external ID. Everything granted
  here is read-only against your resources, PLUS permission to invoke Anthropic
  Claude models in Amazon Bedrock inside your own account (so inference is
  billed to you and your incident text never leaves your account).

  This is a superset of the original CloudOps360 read-only onboarding template
  and uses the same role name, so apply it as a STACK UPDATE to an existing
  CloudOps360 onboarding stack rather than creating a second stack. Delete the
  stack at any time to revoke all access immediately.

  What this role can read: resource configuration (SecurityAudit +
  ViewOnlyAccess), CloudWatch alarms and metric datapoints, and CloudWatch Logs
  content. Reading log CONTENT is required for root-cause analysis and is the
  most sensitive grant here - see the "What NOT to send" section of the
  prerequisites document before enabling it on accounts whose logs carry
  customer PII.

  What this role CANNOT do: change, create, or delete anything. No write action
  is granted on any service. Patch management and Terraform provisioning are
  deliberately out of scope and require separate, explicitly-scoped policies.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: CloudOps360 connection (provided to you on the onboarding page)
        Parameters:
          - TrustedAccountId
          - ExternalId
      - Label:
          default: Amazon Bedrock
        Parameters:
          - BedrockRegion
          - BedrockEndpointMode
          - AllowedModelFamily
          - EnableGuardrails
      - Label:
          default: Knowledge base and optional extras
        Parameters:
          - VectorStoreSecretArn
          - EnableCostExplorer

Parameters:
  TrustedAccountId:
    Type: String
    Description: CloudOps360's AWS account ID (the trusted principal).
    AllowedPattern: '^\d{12}$'
    ConstraintDescription: Must be a 12-digit AWS account ID.

  ExternalId:
    Type: String
    Description: >
      Shared secret generated by CloudOps360 for this connection. Prevents the
      confused-deputy problem - only requests carrying this exact value may
      assume the role.
    MinLength: 8
    NoEcho: true

  BedrockRegion:
    Type: String
    Default: us-east-1
    Description: >
      The AWS region from which Bedrock inference is called. Bedrock calls are
      denied outside this region by an aws:RequestedRegion condition. Note this
      is the CALLING region - with the global. or geo (us./eu./au.) model ID
      prefixes, Bedrock may route the inference itself to other regions.
    AllowedPattern: '^[a-z]{2}(-[a-z]+)+-\d$'

  BedrockEndpointMode:
    Type: String
    Default: Mantle
    AllowedValues: [Mantle, Runtime, Both]
    Description: >
      Mantle (recommended) = the Messages API endpoint
      bedrock-mantle.{region}.api.aws, granting bedrock-mantle:CreateInference.
      Runtime = the InvokeModel/Converse endpoint, granting
      bedrock:InvokeModel(WithResponseStream); required if you mandate Bedrock
      Guardrails. Both = grant either path.

  AllowedModelFamily:
    Type: String
    Default: 'anthropic.claude-*'
    Description: >
      Model ID pattern this role may invoke. The default allows any Anthropic
      Claude model. Narrow it to pin a specific model, e.g.
      anthropic.claude-sonnet-5.

  EnableGuardrails:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: >
      Grant bedrock:ApplyGuardrail so prompts and completions pass through a
      Bedrock Guardrail you own. Requires BedrockEndpointMode Runtime or Both -
      the Mantle endpoint does not support Guardrails.

  VectorStoreSecretArn:
    Type: String
    Default: ''
    Description: >
      Optional. ARN of the Secrets Manager secret holding the credentials for
      the PostgreSQL/pgvector knowledge base. Leave blank if the knowledge base
      credential is delivered another way.

  EnableCostExplorer:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: >
      Grant ce:GetCostAndUsage (account-wide, read-only, no resource-level
      scoping exists for Cost Explorer). Without this, CloudOps360 cannot show
      you your own Bedrock and infrastructure spend - the cost panel stays
      empty. Neither SecurityAudit nor ViewOnlyAccess covers it.

Conditions:
  UseMantle: !Or
    - !Equals [!Ref BedrockEndpointMode, 'Mantle']
    - !Equals [!Ref BedrockEndpointMode, 'Both']
  UseRuntime: !Or
    - !Equals [!Ref BedrockEndpointMode, 'Runtime']
    - !Equals [!Ref BedrockEndpointMode, 'Both']
  WantGuardrails: !Equals [!Ref EnableGuardrails, 'true']
  WantCostExplorer: !Equals [!Ref EnableCostExplorer, 'true']
  HaveVectorSecret: !Not [!Equals [!Ref VectorStoreSecretArn, '']]

Resources:
  CloudOps360ScanRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: CloudOps360ScanRole
      Description: Read-only role assumed by CloudOps360, plus Bedrock model invocation.
      MaxSessionDuration: 43200 # 12h ceiling; CloudOps360 requests 1h sessions by default.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${TrustedAccountId}:root'
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                sts:ExternalId: !Ref ExternalId
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/SecurityAudit
        - arn:aws:iam::aws:policy/job-function/ViewOnlyAccess
      Policies:
        # ------------------------------------------------------------------
        # 1. Telemetry reads for root-cause analysis.
        #
        # SecurityAudit and ViewOnlyAccess cover describe/list of resource
        # CONFIGURATION but NOT metric datapoints or log CONTENT, so the SRE
        # lane needs those named explicitly. Stated inline rather than via
        # another managed policy so the grant is auditable in one place and
        # cannot silently widen when AWS revises a managed policy.
        # ------------------------------------------------------------------
        - PolicyName: CloudOps360SreReadOnly
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: CloudWatchAlarmsAndMetricsRead
                Effect: Allow
                Action:
                  - cloudwatch:DescribeAlarms
                  - cloudwatch:DescribeAlarmHistory
                  - cloudwatch:GetMetricStatistics
                  - cloudwatch:GetMetricData
                  - cloudwatch:ListMetrics
                Resource: '*'

              - Sid: CloudWatchLogsRead
                Effect: Allow
                # This is the grant that lets CloudOps360 read your application
                # log CONTENT. It is what makes evidence-based root-cause
                # analysis possible, and it is the one to scrutinise hardest.
                Action:
                  - logs:DescribeLogGroups
                  - logs:DescribeLogStreams
                  - logs:FilterLogEvents
                  - logs:GetLogEvents
                Resource: '*'

              - Sid: AlarmedResourceHealthRead
                Effect: Allow
                # Every action here is called by the agent's
                # describe_alarmed_resource tool. Named explicitly rather than
                # relying on incidental SecurityAudit/ViewOnlyAccess coverage,
                # so the grant survives AWS revising those managed policies.
                Action:
                  - ec2:DescribeInstances
                  - ec2:DescribeInstanceStatus
                  - rds:DescribeDBInstances
                  - rds:DescribeEvents
                  - lambda:GetFunctionConfiguration
                  - ecs:DescribeServices
                  - elasticloadbalancing:DescribeTargetGroups
                  - elasticloadbalancing:DescribeTargetHealth
                  - dynamodb:DescribeTable
                  - sqs:GetQueueUrl
                  - sqs:GetQueueAttributes
                Resource: '*'

        # ------------------------------------------------------------------
        # 2. Bedrock model invocation, scoped to one region and one model
        #    family. Cross-region inference profiles (the global. and us./eu./
        #    au. prefixes) require permission on BOTH the inference profile ARN
        #    AND the underlying foundation-model ARNs in every region the
        #    profile may route to - which is why the foundation-model resource
        #    uses a region wildcard while aws:RequestedRegion still pins where
        #    the CALL may originate.
        # ------------------------------------------------------------------
        - !If
          - UseMantle
          - PolicyName: CloudOps360BedrockMantleInvoke
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Sid: BedrockMantleCreateInference
                  Effect: Allow
                  Action: bedrock-mantle:CreateInference
                  Resource:
                    - !Sub 'arn:aws:bedrock:*::foundation-model/${AllowedModelFamily}'
                    - !Sub 'arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/*${AllowedModelFamily}'
                  Condition:
                    StringEquals:
                      aws:RequestedRegion: !Ref BedrockRegion
          - !Ref 'AWS::NoValue'

        - !If
          - UseRuntime
          - PolicyName: CloudOps360BedrockRuntimeInvoke
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Sid: BedrockInvokeModel
                  Effect: Allow
                  Action:
                    - bedrock:InvokeModel
                    - bedrock:InvokeModelWithResponseStream
                  Resource:
                    - !Sub 'arn:aws:bedrock:*::foundation-model/${AllowedModelFamily}'
                    - !Sub 'arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/*${AllowedModelFamily}'
                  Condition:
                    StringEquals:
                      aws:RequestedRegion: !Ref BedrockRegion
          - !Ref 'AWS::NoValue'

        - !If
          - WantGuardrails
          - PolicyName: CloudOps360BedrockGuardrail
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Sid: BedrockApplyGuardrail
                  Effect: Allow
                  Action: bedrock:ApplyGuardrail
                  # Scoped to guardrails in this account. Narrow to a specific
                  # guardrail ARN once you have created it.
                  Resource: !Sub 'arn:aws:bedrock:${BedrockRegion}:${AWS::AccountId}:guardrail/*'
          - !Ref 'AWS::NoValue'

        # ------------------------------------------------------------------
        # 3. Knowledge-base credential. Scoped to exactly one secret ARN.
        # ------------------------------------------------------------------
        - !If
          - HaveVectorSecret
          - PolicyName: CloudOps360VectorStoreSecretRead
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Sid: ReadVectorStoreCredential
                  Effect: Allow
                  Action:
                    - secretsmanager:GetSecretValue
                    - secretsmanager:DescribeSecret
                  Resource: !Ref VectorStoreSecretArn
          - !Ref 'AWS::NoValue'

        # ------------------------------------------------------------------
        # 4. Cost visibility. Cost Explorer has no resource-level permissions,
        #    so this is necessarily account-wide - but it is read-only and
        #    returns aggregated cost figures, not resource configuration.
        # ------------------------------------------------------------------
        - !If
          - WantCostExplorer
          - PolicyName: CloudOps360CostRead
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Sid: CostExplorerRead
                  Effect: Allow
                  Action:
                    - ce:GetCostAndUsage
                    - ce:GetDimensionValues
                  Resource: '*'
          - !Ref 'AWS::NoValue'

Outputs:
  RoleArn:
    Description: Paste this Role ARN back into the CloudOps360 onboarding page.
    Value: !GetAtt CloudOps360ScanRole.Arn

  BedrockRegionConfigured:
    Description: The only region from which this role may call Bedrock.
    Value: !Ref BedrockRegion

  BedrockEndpointConfigured:
    Description: Which Bedrock endpoint path this role was granted.
    Value: !Ref BedrockEndpointMode

  AllowedModelFamilyConfigured:
    Description: The Bedrock model ID pattern this role may invoke.
    Value: !Ref AllowedModelFamily
