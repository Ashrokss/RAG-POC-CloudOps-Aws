  expected_answer_summary: "Module v3.0.0 silently dropped a renamed trust-policy input variable and fell back to a default template that added an sts:ExternalId condition to the lambda.amazonaws.com principal statement, a condition the Lambda service principal never supplies, so every AssumeRole attempt was denied."
  notes: ""

