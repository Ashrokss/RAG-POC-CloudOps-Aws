# Golden question-answer set for the RAG evaluation harness. Every question is
# hand-authored against the 20 synthetic RCA docs in data/raw_rca_docs/synthetic/
# so expected_answer_summary is always traceable to a specific doc's Root Cause,
# Timeline, or Resolution section rather than a paraphrase of a paraphrase.
#
# The keyword-type questions each reuse an exact substring from the source doc
# body on purpose - that is what lets a BM25/keyword retriever score them well,
# which is the point of comparison against the semantic-type questions asking
# about the same fact with deliberately non-overlapping vocabulary.

- qid: "37eadf7b-16f2-4890-813e-95fbd7197c6b"
  question: "What was the root cause of INC-2025-0101?"
  question_type: factual
  relevant_doc_ids: ["ff1500b6-527b-442a-ba8e-6fc87c224de3"]
  expected_answer_summary: "checkout-order-processor opened a new raw psycopg2 connection per invocation instead of using a pooled connection (e.g. RDS Proxy), and with no ReservedConcurrentExecutions ceiling set, a 9x traffic spike let it scale to 2,800 concurrent executions, driving connection demand past orders-prod-pg's max_connections=500."
  notes: ""

- qid: "cb3b4fb9-d750-480a-8e52-5ca2cf1a9b04"
  question: "How did the on-call team mitigate the RDS IOPS throttling incident, INC-2025-0102?"
  question_type: factual
  relevant_doc_ids: ["f8c8d772-7708-4a36-aeb6-8ec48c00cc52"]
  expected_answer_summary: "On-call increased provisioned IOPS on analytics-prod-mysql from 3,000 to 8,000 via aws rds modify-db-instance --apply-immediately, which applied without downtime for the gp3 volume and let WriteIOPS utilization fall to 61%."
  notes: ""

- qid: "47e4d4df-1355-4362-b7e4-2329dcef1e44"
  question: "Which subnet ran out of IP addresses in INC-2025-0201, and what fixed it?"
  question_type: factual
  relevant_doc_ids: ["fe5019d4-a53d-4734-8d7d-be844151c3d7"]
  expected_answer_summary: "subnet-0a1b2c3d4e5f67890, a /26 block shared by four VPC-attached Lambda functions and EC2 batch workers, ran out of free IPv4 addresses; on-call added a second, larger /24 subnet, subnet-0f9e8d7c6b5a43210, to payments-webhook-handler's VPC configuration."
  notes: ""

- qid: "19481698-bff0-4a0a-9203-a602ca75dc65"
  question: "Why was notification-dispatcher throttled during the May 30, 2025 launch spike in INC-2025-0202?"
  question_type: factual
  relevant_doc_ids: ["00d240fe-644d-450e-aa61-cb7d3c208ad5"]
  expected_answer_summary: "Its ReservedConcurrentExecutions had been fixed at 50 during a March 2025 cost-optimization pass and never revisited, and a reservation is a hard ceiling that cannot borrow from the account's otherwise-idle unreserved concurrency pool, so the launch spike's demand was rejected outright once it exceeded 50."
  notes: ""

- qid: "f154e92e-6deb-470f-96b5-ab99f75c22bf"
  question: "What caused the S3 403 errors in INC-2025-0301?"
  question_type: factual
  relevant_doc_ids: ["ae15d9eb-da95-48a3-a12f-2833868ba966"]
  expected_answer_summary: "PR #4821 replaced reports-export-prod's hand-written bucket policy with a Terraform-generated one whose merge referenced a stale data source, silently dropping the AllowCloudFrontOAI statement so the bucket defaulted to implicit deny for the CloudFront origin access identity."
  notes: ""

- qid: "c4bcf875-a2f2-4da8-b547-e23006c6c531"
  question: "What made the S3 cross-region replication lag in INC-2025-0302 customer-facing rather than just a backend delay?"
  question_type: factual
  relevant_doc_ids: ["cb8eac5b-9878-4251-8db9-82347b154dc3"]
  expected_answer_summary: "CloudFront's regional read origin in us-west-2 treated the replica bucket as authoritative regardless of ReplicationLatency and kept serving the last-replicated (stale) object version instead of falling back to the source region, so KMS-throttled replication lag turned directly into stale prices and stock at checkout."
  notes: ""

- qid: "de5cdcec-2939-4981-9cf9-d13efc8599de"
  question: "What target-group setting caused dropped in-flight checkout requests during ASG scale-in in INC-2025-0401?"
  question_type: factual
  relevant_doc_ids: ["2317f2b0-e9df-4bb2-9a64-9e323dc17452"]
  expected_answer_summary: "checkout-tg's deregistration_delay.timeout_seconds attribute was left at 0 because the Terraform module that created it set no explicit default, so the ALB deregistered terminating instances with zero connection draining and reset any in-flight requests."
  notes: ""

- qid: "8271c9f3-d1f9-41b4-a7c2-66dfb2b836da"
  question: "Why did orders-api-asg enter a flapping instance-replacement loop in INC-2025-0402?"
  question_type: factual
  relevant_doc_ids: ["81d319d3-40d3-4f43-8af1-2b4f69167ea5"]
  expected_answer_summary: "A v3.6.0 deploy added a synchronous cache-warming step that extended orders-api's startup time from about 20 seconds to about 90 seconds, but the ASG's HealthCheckGracePeriod remained at 30 seconds, so every new instance was marked unhealthy and terminated before it could finish starting, and each replacement hit the same problem."
  notes: ""

- qid: "80f9bc7d-7c72-477a-9842-2829d8ba950e"
  question: "What Redis configuration mismatch caused the eviction storm in INC-2025-0501?"
  question_type: factual
  relevant_doc_ids: ["b61f30fb-81d0-4922-8041-8be5f4ad7eea"]
  expected_answer_summary: "session-service v2.14.0 started writing session keys without a TTL, but sessions-redis-001's maxmemory-policy was volatile-lru, which only evicts keys that carry an expiry, so the non-expiring keys permanently occupied memory until the cluster hit 99.7% of maxmemory and began rejecting writes."
  notes: ""

- qid: "7075696b-8b18-4474-89f8-bea963d89ca8"
  question: "What triggered the brief write errors on orders-cache-prod in INC-2025-0502?"
  question_type: factual
  relevant_doc_ids: ["7761f1cb-19bd-4cf3-b9c9-6548de597742"]
  expected_answer_summary: "AWS applied a routine Redis 7.0.7-to-7.1.0 engine-version patch during the cluster's scheduled maintenance window, which triggered an automatic failover promoting a replica to primary; the client library's lack of retry-on-timeout and reliance on 30-second DNS TTL caused a short window of failed writes during the topology change."
  notes: ""

- qid: "db5b434e-daff-41cc-8132-f4f830c86db2"
  question: "What was the underlying account-level constraint behind the API Gateway 429s in INC-2025-0601?"
  question_type: factual
  relevant_doc_ids: ["e12951e9-da01-4b96-85a6-38805cc34f85"]
  expected_answer_summary: "The us-east-1 account-level API Gateway throttle remained at the AWS default (10,000 RPS steady-state, 5,000-request burst), and no Service Quota increase had been requested even though marketing had shared a 12,000 RPS peak-traffic projection three days before the campaign."
  notes: ""

- qid: "aecc7884-b846-4f49-aa33-443f70a24398"
  question: "What two independent changes combined to cause the 504 errors in INC-2025-0602?"
  question_type: factual
  relevant_doc_ids: ["42c22167-17cf-49db-8a1e-4b1d8f2ba396"]
  expected_answer_summary: "A new transitive dependency bloated order-enrichment-svc's deployment package from 46 MB to 268 MB, lengthening cold starts, and the same Terraform apply omitted provisioned_concurrent_executions, resetting provisioned concurrency from 20 to 0, so nearly every request cold-started past API Gateway's fixed 29-second timeout."
  notes: ""

- qid: "b4bb4778-1a44-4254-91ca-28a373ceeb9c"
  question: "Why did the tenant_00042 batch import throttle in INC-2025-0701 despite customer-events-prod having 4,000 WCU provisioned?"
  question_type: factual
  relevant_doc_ids: ["fca24f95-19cb-4418-908f-2b49974a6f9f"]
  expected_answer_summary: "Every one of the 2.4 million imported records shared the same partition key value (tenant_id = tenant_00042), and DynamoDB enforces a hard per-partition ceiling of 1,000 WCU regardless of the table's overall provisioned throughput, so the single-key burst was throttled even though aggregate table capacity was unused."
  notes: ""

- qid: "367c251b-de2f-49f2-b6cd-b715cdda3bb4"
  question: "What combination of causes led to the DynamoDB cost and latency spike in INC-2025-0702?"
  question_type: factual
  relevant_doc_ids: ["1d1168e0-5a88-4c52-ad00-03bec93ebd87"]
  expected_answer_summary: "orders-prod had no GSI covering lookups by customer_email or status, so two code paths used full-table Scans, and an EventBridge schedule bug ran the reconciliation job every 15 minutes instead of daily, multiplying scan frequency roughly 96x and driving both cost and checkout read latency up."
  notes: ""

- qid: "e90a181d-9eba-42c7-b085-21126723dcc7"
  question: "Why did not the ACM certificate for www.acmecloudops.com auto-renew before it expired in INC-2025-0801?"
  question_type: factual
  relevant_doc_ids: ["5040b325-bf2f-4ffb-8f90-c1a89f69e831"]
  expected_answer_summary: "Its DNS validation CNAME had been deleted from Route 53 during an unrelated hosted-zone cleanup 63 days before expiry, silently disabling auto-renewal, and the resulting renewal-failure emails from ACM went to an alias with no active subscriber."
  notes: ""

- qid: "0e5fa406-bf89-474d-aa31-89f47348a0c7"
  question: "What caused the ALB target-group health checks to flap during the prod-web-service v2.38.0 deploy in INC-2025-0802?"
  question_type: factual
  relevant_doc_ids: ["4c51612d-46bc-42b1-a6f0-faa18404fd2a"]
  expected_answer_summary: "The new task definition cut the Fargate container memory limit from 2048 MiB to 1024 MiB but left the JVM's -Xmx1536m heap flag unchanged, causing frequent 700ms-1.2s full-GC pauses that occasionally pushed the DB-coupled /healthz check past its 5-second timeout and got targets marked unhealthy."
  notes: ""

- qid: "398ddd29-3790-4c0d-8a21-7aad76442823"
  question: "Why were metrics-ingestor-svc tasks OOMKilled in INC-2025-0901?"
  question_type: factual
  relevant_doc_ids: ["0bf82776-629e-41c6-bcdc-cebf6d349e88"]
  expected_answer_summary: "A pandas (1.5.3 to 2.1.1) and numpy (1.24.4 to 1.26.0) dependency upgrade raised the service's steady-state memory footprint from roughly 380 MB to roughly 640 MB per task, exceeding the task definition's unchanged 512 MiB hard memory limit, so the Fargate kernel repeatedly killed the container."
  notes: ""

- qid: "60eda6ed-362e-4c76-80f8-a0cce002c3c6"
  question: "Why did prod-checkout-svc fail to scale out during the flash sale in INC-2025-0902?"
