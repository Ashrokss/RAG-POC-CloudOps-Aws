  question_type: semantic
  relevant_doc_ids: ["00d240fe-644d-450e-aa61-cb7d3c208ad5"]
  expected_answer_summary: "Its concurrency had been permanently capped months earlier for cost reasons, and that kind of fixed reservation is enforced as a hard ceiling that cannot borrow from the account's otherwise-idle shared concurrency pool, even when that pool has plenty of room."
  notes: ""

- qid: "011db915-0ac4-4370-a84f-3a77de5148f6"
  question: "How did an infrastructure-as-code refactor accidentally lock legitimate CDN traffic out of a storage bucket?"
  question_type: semantic
  relevant_doc_ids: ["ae15d9eb-da95-48a3-a12f-2833868ba966"]
  expected_answer_summary: "A bucket-policy-generation change referenced an outdated data source during a merge, so the statement permitting the CDN's origin access identity to read objects was silently omitted, and the bucket defaulted to denying those requests."
  notes: ""

- qid: "196716ef-fe97-4097-8fb3-8654ebe72fbb"
  question: "Why did shoppers on the West Coast see outdated prices and inventory after a large catalog update?"
  question_type: semantic
  relevant_doc_ids: ["cb8eac5b-9878-4251-8db9-82347b154dc3"]
  expected_answer_summary: "A large overnight batch of catalog writes overwhelmed the encryption calls needed for cross-region replication, and the West Coast edge origin kept serving the older regional copy as authoritative instead of detecting the lag and falling back to the source region."
  notes: ""

- qid: "8e3ccd87-cfcf-4c17-8c13-f09e212b0d74"
  question: "Why were in-progress checkout connections severed the instant a scale-in event removed server capacity?"
  question_type: semantic
  relevant_doc_ids: ["2317f2b0-e9df-4bb2-9a64-9e323dc17452"]
  expected_answer_summary: "The load balancer's grace period for letting an outgoing server finish existing connections before removal had been left at zero, so terminated instances stopped serving mid-request instead of being allowed to finish pending work first."
  notes: ""

- qid: "faf880f7-2d1d-4fdb-acbc-d7f7be851e58"
  question: "Why did a routine software release trigger an unending cycle of new servers being replaced right after they came up?"
  question_type: semantic
  relevant_doc_ids: ["81d319d3-40d3-4f43-8af1-2b4f69167ea5"]
  expected_answer_summary: "The new release made application startup take much longer, but the scaling group's tolerance window for a new server to pass its first health check was not increased to match, so every replacement was judged unhealthy and swapped out before it finished starting, repeating indefinitely."
  notes: ""

- qid: "63156720-70bd-4cb9-990e-29de4614a210"
  question: "Why did an in-memory cache run out of room even though it was supposed to automatically clear out old entries?"
  question_type: semantic
  relevant_doc_ids: ["b61f30fb-81d0-4922-8041-8be5f4ad7eea"]
  expected_answer_summary: "A code change stopped attaching an expiration to newly written entries, and the cache's eviction policy only removes entries that carry an expiration, so those entries piled up permanently until there was no room left to write."
  notes: ""

- qid: "be0c8788-f753-4a1d-a0bf-00eb7f4ea0d8"
  question: "Why did some database-cache write requests briefly fail during a routine patch window?"
  question_type: semantic
  relevant_doc_ids: ["7761f1cb-19bd-4cf3-b9c9-6548de597742"]
  expected_answer_summary: "An automatic engine-version upgrade triggered a fast failover to a standby node, but the application's client had no retry-on-timeout logic and relied on a slow-to-expire cached DNS lookup to discover the new primary, so a handful of requests hit stale endpoints in that short gap."
  notes: ""

- qid: "6112d6bf-44c3-4200-8fc9-afa2ef29c8e1"
  question: "How did a mass mobile notification blow past an API's traffic ceiling even though the team had warned about it in advance?"
  question_type: semantic
  relevant_doc_ids: ["e12951e9-da01-4b96-85a6-38805cc34f85"]
  expected_answer_summary: "The account-wide rate limit for the region had been left at its default value, and even though the marketing team had shared a peak-traffic estimate exceeding that default days ahead of time, no capacity increase had been requested before the campaign went out."
  notes: ""

- qid: "3818fb0d-422b-4d42-9b29-093e7bb66bc8"
  question: "How did two unrelated deployment mistakes combine into a widespread request-timeout problem?"
  question_type: semantic
  relevant_doc_ids: ["42c22167-17cf-49db-8a1e-4b1d8f2ba396"]
  expected_answer_summary: "One change unintentionally pulled in a heavy library that dramatically slowed function startup, and a separate configuration omission reset a pre-warmed capacity setting to zero, so nearly every request had to endure the slow startup and exceeded the gateway's fixed wait limit."
  notes: ""

- qid: "e5c469a2-62dc-4153-b50f-ff5ef8192fd0"
  question: "Why did a single customer's data-loading job get rate-limited even though the overall table had plenty of spare write capacity?"
  question_type: semantic
  relevant_doc_ids: ["fca24f95-19cb-4418-908f-2b49974a6f9f"]
  expected_answer_summary: "Every record in the load shared the identical key value, so all of the writes landed on one internal storage partition, which carries its own fixed throughput ceiling that overall table-level capacity cannot override."
  notes: ""

- qid: "bb18ccde-8d15-4816-b0d3-bc2821e79f8c"
  question: "Why did unrelated checkout reads slow to a crawl after a background job's schedule was mistyped?"
  question_type: semantic
  relevant_doc_ids: ["1d1168e0-5a88-4c52-ad00-03bec93ebd87"]
  expected_answer_summary: "A reconciliation job meant to run once a day was instead firing every fifteen minutes, and because its lookups had no supporting index, each run scanned the entire table, repeatedly consuming most of the shared read capacity that other reads also needed."
  notes: ""

- qid: "24b67d63-9080-42c6-87b4-b12712ccb8d5"
  question: "Why did a website's secure certificate lapse without anyone noticing in time?"
  question_type: semantic
  relevant_doc_ids: ["5040b325-bf2f-4ffb-8f90-c1a89f69e831"]
  expected_answer_summary: "The DNS record the certificate authority used to confirm ongoing domain ownership had been removed months earlier during an unrelated cleanup, silently stopping automatic renewal, and the resulting failure notices were sent to an inbox nobody was monitoring."
  notes: ""

- qid: "d39569e4-cb7f-46e7-86a3-dbe2b2b3a2f1"
  question: "How did shrinking a container's memory allowance end up taking an entire web tier offline intermittently?"
  question_type: semantic
  relevant_doc_ids: ["4c51612d-46bc-42b1-a6f0-faa18404fd2a"]
  expected_answer_summary: "The container's memory ceiling was lowered without adjusting the application's internal heap setting, so garbage-collection pauses grew long enough to occasionally miss the load balancer's health-check window, and the resulting removal of capacity piled extra load onto the remaining servers, making the problem recur in waves."
  notes: ""

- qid: "8d1c274f-2d9e-4872-b053-e5d8ee9bcdef"
  question: "Why did upgrading two common data-processing libraries cause containers to be killed repeatedly?"
  question_type: semantic
  relevant_doc_ids: ["0bf82776-629e-41c6-bcdc-cebf6d349e88"]
  expected_answer_summary: "The new library versions substantially increased how much memory the service used at steady state, and because the container's fixed memory ceiling was not raised to match, the orchestrator's kernel began terminating the process every time it exceeded that limit."
  notes: ""

- qid: "b6ca6b1e-ab4b-41b4-a081-62c71b0f9048"
  question: "Why did adding more containers to handle a demand surge not actually add much usable capacity?"
  question_type: semantic
  relevant_doc_ids: ["90e3ea03-4631-45d3-a7ee-349ab267ccba"]
  expected_answer_summary: "The network subnets those containers needed addresses from were already nearly full from other shared services, so most of the newly requested containers could not get a network interface assigned and never actually started running."
  notes: ""

- qid: "8a7385cc-27da-4cbb-8107-96bfa36958cc"
  question: "Why did outbound calls to a payment provider start failing silently after a large worker-fleet scale-up?"
  question_type: semantic
  relevant_doc_ids: ["61a6d661-a53d-4002-a8a9-96f1694f3726"]
  expected_answer_summary: "Concentrating a much larger worker fleet's outbound connections through a single shared network gateway pushed concurrent connections to the payment provider's few IP addresses past that gateway's per-destination connection ceiling, and the gateway simply dropped the excess connections rather than signaling a clear error."
  notes: ""

- qid: "e8f83a84-1f1c-4571-9bc7-7d102bceca5f"
  question: "How did upgrading a shared permissions module accidentally lock a scheduled job out of its own role?"
  question_type: semantic
  relevant_doc_ids: ["f0351ec8-1a0b-4015-b0c1-0a7842c9b185"]
  expected_answer_summary: "The module's new version renamed one of its inputs without deprecating the old name, so the old value was quietly dropped and a template meant only for test fixtures was applied instead, adding a condition to the role's trust policy that the calling service can never fulfill."
  notes: ""

- qid: "1d0ced87-a311-4bc3-9f92-1546675be3af"
  question: "How do the root causes of the two RDS incidents, INC-2025-0101 and INC-2025-0102, differ?"
  question_type: cross_document
  relevant_doc_ids: ["ff1500b6-527b-442a-ba8e-6fc87c224de3", "f8c8d772-7708-4a36-aeb6-8ec48c00cc52"]
  expected_answer_summary: "INC-2025-0101 was a connection-count problem: unbounded Lambda concurrency opened unpooled connections that exhausted max_connections. INC-2025-0102 was a throughput problem: nightly ETL write volume outgrew provisioned IOPS, which storage-size autoscaling does nothing to compensate for since it governs volume size, not IOPS."
  notes: ""

- qid: "bc171bd1-a29c-46bf-8b44-45cee81f5ba9"
  question: "What is the key difference between the two Lambda incidents, INC-2025-0201 and INC-2025-0202?"
  question_type: cross_document
  relevant_doc_ids: ["fe5019d4-a53d-4734-8d7d-be844151c3d7", "00d240fe-644d-450e-aa61-cb7d3c208ad5"]
  expected_answer_summary: "INC-2025-0201 was a VPC networking failure: the subnet ran out of IP addresses for ENIs, causing cold-start latency and EniLimitExceededException. INC-2025-0202 was a concurrency-configuration failure: a stale fixed ReservedConcurrentExecutions ceiling of 50 could not absorb a launch spike, causing throttling and an SQS backlog."
  notes: ""

- qid: "5d2f119e-cc53-4e46-8105-b32a0a3bd41b"
  question: "Compare the failure modes of the two S3 incidents, INC-2025-0301 and INC-2025-0302."
  question_type: cross_document
  relevant_doc_ids: ["ae15d9eb-da95-48a3-a12f-2833868ba966", "cb8eac5b-9878-4251-8db9-82347b154dc3"]
  expected_answer_summary: "INC-2025-0301 was an access-control regression where a Terraform merge silently dropped a permission statement, producing immediate hard 403 errors. INC-2025-0302 was a replication-latency incident where a KMS throttling bottleneck delayed cross-region replication, producing stale but successful reads rather than errors."
  notes: ""

- qid: "a85405fa-542c-4826-8714-ce811d8aae7c"
  question: "What do the two EC2 Auto Scaling incidents, INC-2025-0401 and INC-2025-0402, have in common, and how do they differ?"
  question_type: cross_document
  relevant_doc_ids: ["2317f2b0-e9df-4bb2-9a64-9e323dc17452", "81d319d3-40d3-4f43-8af1-2b4f69167ea5"]
  expected_answer_summary: "Both stem from an ASG or ALB timing setting left at an inadequate default value. INC-2025-0401's zero-second deregistration delay dropped in-flight requests during a normal scale-in, while INC-2025-0402's too-short health-check grace period killed newly launched instances during a deploy, triggering a self-sustaining replacement loop rather than a one-time drop."
  notes: ""

- qid: "747baf3b-63fd-4bec-a9b6-f203d93e2c88"
  question: "How did the two ElastiCache incidents, INC-2025-0501 and INC-2025-0502, differ in severity and trigger?"
  question_type: cross_document
  relevant_doc_ids: ["b61f30fb-81d0-4922-8041-8be5f4ad7eea", "7761f1cb-19bd-4cf3-b9c9-6548de597742"]
  expected_answer_summary: "INC-2025-0501 was critical and self-inflicted: an application bug omitting TTLs caused sustained memory exhaustion and cascading DynamoDB throttling over 47 minutes. INC-2025-0502 was medium severity and AWS-initiated: a routine maintenance failover caused only a 42-second client-side write-error window due to missing retry logic."
  notes: ""

- qid: "8178eb6c-ccc7-4f89-a657-69d9df1c54d9"
  question: "Contrast the two API Gateway incidents, INC-2025-0601 and INC-2025-0602."
  question_type: cross_document
  relevant_doc_ids: ["e12951e9-da01-4b96-85a6-38805cc34f85", "42c22167-17cf-49db-8a1e-4b1d8f2ba396"]
  expected_answer_summary: "INC-2025-0601 was a rate-limit problem: traffic exceeded the account-level throttle ceiling, producing HTTP 429s. INC-2025-0602 was a backend-latency problem: Lambda cold starts after a deploy misconfiguration exceeded the fixed 29-second integration timeout, producing HTTP 504s."
  notes: ""

- qid: "597f785d-7819-4509-8484-23e65b5a1f88"
  question: "How do the two DynamoDB incidents, INC-2025-0701 and INC-2025-0702, differ in what was overloaded?"
  question_type: cross_document
  relevant_doc_ids: ["fca24f95-19cb-4418-908f-2b49974a6f9f", "1d1168e0-5a88-4c52-ad00-03bec93ebd87"]
  expected_answer_summary: "INC-2025-0701 hit a per-partition write-throughput ceiling because a batch import concentrated writes on one hot key. INC-2025-0702 exhausted table-level read capacity because two code paths used full-table Scans instead of an index-backed Query, worsened by a schedule bug running the job 96x too often."
  notes: ""

- qid: "d0d87b8a-3268-4cb8-93d1-b6578a421aed"
  question: "What distinguishes the two CloudFront-related incidents, INC-2025-0801 and INC-2025-0802?"
  question_type: cross_document
  relevant_doc_ids: ["5040b325-bf2f-4ffb-8f90-c1a89f69e831", "4c51612d-46bc-42b1-a6f0-faa18404fd2a"]
  expected_answer_summary: "INC-2025-0801 was a complete, sustained HTTPS outage caused by an expired, unrenewed ACM certificate. INC-2025-0802 was a partial, cyclical 5xx spike caused by ALB target-group health checks flapping from GC pauses after a container memory-limit reduction, unrelated to certificates."
  notes: ""

- qid: "2b27c762-1be0-4024-9cc0-b0a72cbdf6d7"
  question: "How do the two ECS Fargate incidents, INC-2025-0901 and INC-2025-0902, differ in root cause?"
  question_type: cross_document
  relevant_doc_ids: ["0bf82776-629e-41c6-bcdc-cebf6d349e88", "90e3ea03-4631-45d3-a7ee-349ab267ccba"]
  expected_answer_summary: "INC-2025-0901 was per-task memory exhaustion: a dependency upgrade raised memory footprint past the hard task memory limit, causing existing tasks to be OOMKilled. INC-2025-0902 was VPC IP-address exhaustion during scale-out: undersized subnets had no free addresses for new tasks' ENIs, capping added capacity rather than killing running tasks."
  notes: ""

# The 17 entries below cover the 5 real-world RCA docs added under
# data/raw_rca_docs/real/ - four famous public postmortems (AWS S3 2017,
# Cloudflare Nov 2023, GitLab DB 2017, Meta BGP 2021) plus one complete
# Azure/Terraform example incident (INC-2026-0142). Same factual/keyword/
# semantic split as above, plus two cross_document questions linking a real
# incident to a thematically related synthetic one.

- qid: "238e161b-d214-42ba-8854-959b1824223d"
  question: "What was the root cause of the 2017 Amazon S3 outage tracked as INC-2017-0228-S3-USEAST1?"
  question_type: factual
  relevant_doc_ids: ["6a7f1666-ce66-4581-8b66-4e0e27ffa087"]
  expected_answer_summary: "The maintenance tool used to remove servers from S3's index and placement subsystems had no lower-bound safeguard to validate the input against a minimum required capacity, so a single mistyped parameter removed far more server capacity than intended from both subsystems simultaneously."
  notes: ""

- qid: "c98fe40f-5372-4a22-adca-2a8ce1f9a1e0"
  question: "Why did the AWS Service Health Dashboard fail to update during the February 28, 2017 S3 disruption?"
  question_type: keyword
  relevant_doc_ids: ["6a7f1666-ce66-4581-8b66-4e0e27ffa087"]
  expected_answer_summary: "The Service Health Dashboard was itself hosted on S3 in the affected US-EAST-1 region, so when S3 failed the dashboard failed too; engineers switched to an alternate page and Twitter for status updates."
  notes: ""

- qid: "925a1694-fef2-4a72-be1e-03e4fe67212f"
  question: "During this outage, why couldn't the public rely on Amazon's own official status page to learn what was going on?"
  question_type: semantic
  relevant_doc_ids: ["6a7f1666-ce66-4581-8b66-4e0e27ffa087"]
  expected_answer_summary: "The status page depended on the very storage service that had failed, so it went down along with everything else, forcing the team to communicate through alternate channels."
  notes: ""

- qid: "7246a3d4-eb24-4c5e-95b1-e5f6ddd9e56a"
  question: "What made Cloudflare's high-availability cluster fail to fully absorb the PDX-04 power outage in INC-2023-1102-CF-CONTROLPLANE?"
  question_type: factual
  relevant_doc_ids: ["38a80fbd-ef61-426f-ae6e-a19cf9834cf3"]
  expected_answer_summary: "The Kafka and ClickHouse logging/analytics cluster had an undisclosed, single-facility dependency on PDX-04 that was never tested, so the two healthy core data centers could not take over that workload even though the HA design intended active-active redundancy."
  notes: ""

- qid: "3f8617b3-ff1b-404c-b539-6d97e11430ba"
  question: "How long were Cloudflare's UPS batteries at PDX-04 rated to last, and how long did they actually last before failing?"
  question_type: keyword
  relevant_doc_ids: ["38a80fbd-ef61-426f-ae6e-a19cf9834cf3"]
  expected_answer_summary: "The UPS batteries were rated for about 10 minutes of runtime but began failing after only about 4 minutes."
  notes: ""

- qid: "5abfa4ee-6b72-48d2-9665-dc2149d89a79"
  question: "Why wasn't Cloudflare told sooner that its data center had switched to backup power?"
  question_type: semantic
  relevant_doc_ids: ["38a80fbd-ef61-426f-ae6e-a19cf9834cf3"]
  expected_answer_summary: "Flexential, the facility operator, did not proactively notify Cloudflare when it failed over to generator power, removing an early warning window Cloudflare could have used to move workloads out preemptively."
  notes: ""

- qid: "2c1d39b3-d96b-4bd8-8b53-68780ef65066"
  question: "What was the only usable recovery point after the accidental primary database deletion in INC-2017-0131-GITLAB-DB?"
  question_type: factual
  relevant_doc_ids: ["ed1935ec-3970-43d0-b67d-75f7189b9b87"]
  expected_answer_summary: "A manually created LVM snapshot taken about six hours before the deletion, at approximately 17:20 UTC, was the only usable restore point, since the secondary, the pg_dump backups, and database disk snapshots were all unavailable or broken."
  notes: ""

- qid: "a27699af-c9c7-4368-8649-74d3e45bbbc1"
  question: "What PostgreSQL client version mismatch caused GitLab's pg_dump backups to silently fail before the January 2017 database incident?"
  question_type: keyword
  relevant_doc_ids: ["ed1935ec-3970-43d0-b67d-75f7189b9b87"]
  expected_answer_summary: "The pg_dump backup process was using PostgreSQL 9.2 client tooling against a PostgreSQL 9.6 production server, an incompatible version pairing that caused the backups to fail without being detected."
  notes: ""

- qid: "73632ca8-31ad-4fee-836d-1abea0688f77"
  question: "Why did nobody notice that GitLab's database backups weren't actually working before they were needed?"
  question_type: semantic
  relevant_doc_ids: ["ed1935ec-3970-43d0-b67d-75f7189b9b87"]
  expected_answer_summary: "There was no independent monitoring of backup success, and the failure-notification emails that should have flagged the problem were being rejected, so the backup failures went undetected until an actual recovery was attempted."
  notes: ""

- qid: "1cf56091-4593-48ee-a64a-9ae5ce047312"
  question: "Why did Facebook's own DNS servers make the October 2021 outage worse, per INC-2021-1004-META-BGP?"
  question_type: factual
  relevant_doc_ids: ["06fa99fa-ce29-4289-a8b0-3768ea4677bc"]
  expected_answer_summary: "Facebook's DNS servers are designed to automatically withdraw their own BGP route advertisements when they can't reach Facebook's data centers as a safety mechanism; once the entire backbone went down, every DNS server withdrew its routes simultaneously, making the domains globally unresolvable rather than just internally unreachable."
  notes: ""

- qid: "241cf36f-b09a-4627-8d1e-9e06136e1af0"
  question: "What specifically prevented Meta's internal audit tool from blocking the backbone command that caused the October 2021 outage?"
  question_type: keyword
  relevant_doc_ids: ["06fa99fa-ce29-4289-a8b0-3768ea4677bc"]
  expected_answer_summary: "The internal audit tool was specifically designed to catch and block exactly this kind of overly broad, high-impact command, but it contained a bug that let the command through instead of stopping it."
  notes: ""

- qid: "2ab4e984-e3ec-4029-8bb9-b9d6bc653205"
  question: "Why couldn't engineers just log in remotely and undo the change once they knew what had gone wrong?"
  question_type: semantic
  relevant_doc_ids: ["06fa99fa-ce29-4289-a8b0-3768ea4677bc"]
  expected_answer_summary: "The same network outage had also taken down Facebook's internal tools, communications systems, and remote access, and even some physical badge readers, so engineers had to travel physically to data centers to fix the hardware on-site."
  notes: ""

- qid: "75e57c78-f5cf-4e38-a55e-0662415fd6a1"
  question: "What was the root cause of INC-2026-0142, the Terraform drift-remediation incident on prod-vnet?"
  question_type: factual
  relevant_doc_ids: ["f296bb79-05c7-4140-85c2-da97b5942a4d"]
  expected_answer_summary: "An engineer had manually changed the subnet's CIDR in the Azure Portal two weeks earlier without updating Terraform state, creating drift; when the nightly drift-remediation job ran, Terraform could not update the CIDR in place and instead destroyed and recreated the subnet, which detached its NSGs."
  notes: ""

- qid: "926ab845-e324-45f9-a323-ff33c8e241b6"
  question: "Which Azure CLI command did the on-call SRE use to re-attach the detached NSGs in INC-2026-0142?"
  question_type: keyword
  relevant_doc_ids: ["f296bb79-05c7-4140-85c2-da97b5942a4d"]
  expected_answer_summary: "az network vnet subnet update, specifying the resource group, vnet name, subnet name, and --network-security-group prod-nsg-payments."
  notes: ""

- qid: "8161bc88-3836-48a7-bc5e-75cb181169d6"
  question: "What governance gap allowed an out-of-band manual change to silently cause an outage weeks later?"
  question_type: semantic
  relevant_doc_ids: ["f296bb79-05c7-4140-85c2-da97b5942a4d"]
  expected_answer_summary: "There was no policy gate blocking manual out-of-band changes made directly in the cloud portal, and no drift-detection alerting to surface the mismatch before the automated remediation job applied a destructive fix unattended."
  notes: ""

- qid: "24e2b268-f536-48b1-86e4-d7c522778f80"
  question: "How does the root cause of the 2017 GitLab database data-loss incident differ from the root cause of the synthetic RDS connection pool exhaustion incident, INC-2025-0101?"
  question_type: cross_document
  relevant_doc_ids: ["ed1935ec-3970-43d0-b67d-75f7189b9b87", "ff1500b6-527b-442a-ba8e-6fc87c224de3"]
  expected_answer_summary: "The GitLab incident was caused by a human operator error (a destructive command run against the wrong host) compounded by multiple simultaneously-broken backup/recovery safety nets, resulting in permanent data loss. The RDS incident was caused by an application-level design gap (no connection pooling and no concurrency ceiling) that let normal traffic growth exhaust the database's connection limit, with no data loss, only temporary unavailability."
  notes: ""

- qid: "85513e88-4cb5-442f-a751-68e649fb7a45"
  question: "Compare the 2017 Amazon S3 outage to the synthetic S3 incidents INC-2025-0301 and INC-2025-0302 - what type of failure trigger do all three share?"
  question_type: cross_document
  relevant_doc_ids: ["6a7f1666-ce66-4581-8b66-4e0e27ffa087", "ae15d9eb-da95-48a3-a12f-2833868ba966", "cb8eac5b-9878-4251-8db9-82347b154dc3"]
  expected_answer_summary: "All three were triggered by an operational or configuration change rather than a hardware failure or external attack: the 2017 outage by a mistyped maintenance-command parameter with no capacity safeguard, INC-2025-0301 by an IaC bucket-policy regression, and INC-2025-0302 by KMS throttling during cross-region replication - each a case of an internal change or limit tripping up normal operation rather than an external cause."
  notes: ""
