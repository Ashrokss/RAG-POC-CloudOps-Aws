  expected_answer_summary: "Scaling payment-worker-asg from 40 to 260 instances drove aggregate concurrent connections to the payment gateway's small set of fixed upstream IPs past the single NAT Gateway's 55,000-simultaneous-connections-per-destination limit, since all outbound traffic funneled through one NAT Gateway."
  notes: ""

- qid: "2e0a5515-1a7a-4b62-a10c-3136979f904e"
  question: "Why could Lambda not assume nightly-billing-reconciler-role after the Terraform module bump in INC-2025-1002?"
